# docker compose up  ->  http://localhost:3000 with a seeded demo board.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pulseboard
    ports: ['5432:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/pulseboard
      PORT: '3000'
    ports: ['3000:3000']
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
