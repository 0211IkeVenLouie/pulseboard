# Publishes site/ to GitHub Pages — a static showcase for this project.
# The app itself is a server and does not run here; see the README.
name: Pages

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a half-finished deployment; just queue behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Note: `enablement: true` is deliberately not set. The workflow's
      # GITHUB_TOKEN is not allowed to create a Pages site ("Resource not
      # accessible by integration"), so it only produces a failed run. Pages is
      # enabled once, by hand, under Settings -> Pages -> Source: GitHub Actions.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
